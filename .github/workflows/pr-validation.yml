name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: JavaScript syntax
        run: npm run check:syntax
      - name: PR7 operations
        run: npm run check:pr7-operations
      - name: PR7 polling
        run: npm run check:pr7-polling
      - name: PR7 adapter integration
        run: npm run check:pr7-adapter
      - name: PR7 Apps Script runtime emulator
        run: npm run check:pr7-runtime
      - name: PR7 deterministic browser harness
        run: npm run check:pr7-browser-harness
      - name: PR7 controlled concurrency
        run: npm run check:pr7-concurrency
      - name: PR7 migration fixtures
        run: npm run check:pr7-migration
      - name: PR7 audit fixtures
        run: npm run check:pr7-audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: PR7 real Chromium E2E and responsive
        run: npm run check:pr7-browser
      - name: Stage 2
        run: npm run check:stage2-form
      - name: Automation
        run: npm run check:automation-page
      - name: Required files
        run: npm run check:files
      - name: RC6
        run: npm run check:rc6
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
      - name: Sensitive scan
        env:
          PR7_SECURITY_DIFF_FILE: ${{ runner.temp }}/pr7-security.diff
        run: |
          git diff -U0 origin/${{ github.base_ref }}...HEAD -- . ':!assets/images/*' > "$PR7_SECURITY_DIFF_FILE"
          npm run check:pr7-sensitive
      - name: Upload PR7 validation artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pr7-validation-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            test-results/
            playwright-report/
            screenshots/
            traces/
            failure-logs/
